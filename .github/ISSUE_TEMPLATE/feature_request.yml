name: 功能建议
description: 提出新的功能或体验改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请重点描述使用场景和需要解决的问题。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你通常会在什么情况下需要这个功能？
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 现有问题
      description: 当前使用方式有什么不便？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望 Otodo 如何解决这个问题？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 是否尝试过其他解决方式？

  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索已有 Issue，未发现相同建议
          required: true
